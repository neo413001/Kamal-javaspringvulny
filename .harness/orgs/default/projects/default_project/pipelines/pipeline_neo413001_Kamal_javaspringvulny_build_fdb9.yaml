pipeline:
  id: pipeline_neo413001_Kamal_javaspringvulny_build_fdb9
  name: pipeline_neo413001_Kamal_javaspringvulny_build_fdb9
  stages:
    - name: Build and Test
      id: build_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              echo "Java version:"
              java -version
              echo "Building project..."
              ./gradlew build -x test --no-daemon
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              echo "Running tests..."
              ./gradlew test --no-daemon
            report:
              type: junit
              paths:
                - "**/build/test-results/test/*.xml"
  tags:
    onboarding: "true"
